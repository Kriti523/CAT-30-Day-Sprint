# Runs on every pull request and on main: typecheck + production build, logic tests, then the browser UI test.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, build, logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and build (tsc -b && vite build)
        run: npm run build
      - name: Logic tests
        run: npm test

  ui:
    name: UI test (Playwright)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install Playwright + Chromium
        # --with-deps apt-installs fonts and libraries; if Ubuntu's mirrors are unreachable (it happens), fall back to
        # the browser alone: GitHub's Ubuntu image ships Google Chrome, so Chromium's shared libraries are already there.
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Single-file build tested by the UI test
        run: npm run build:offline
      - name: UI test (offline, synthetic session; no Supabase calls)
        run: python scripts/ui_test.py
      - name: Keep screenshots when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: test-shots/
